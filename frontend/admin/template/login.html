<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Flat Steel Prediction</title>

    <link rel="icon" href="../assets/images/fuso_logo.png" type="image/x-icon">
    <link rel="shortcut icon" href="../assets/images/fuso_logo.png" type="image/x-icon">

    <!-- Google font -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Riho CSS -->
    <link rel="stylesheet" href="../assets/css/font-awesome.css">
    <link rel="stylesheet" href="../assets/css/vendors/icofont.css">
    <link rel="stylesheet" href="../assets/css/vendors/themify.css">
    <link rel="stylesheet" href="../assets/css/vendors/flag-icon.css">
    <link rel="stylesheet" href="../assets/css/vendors/feather-icon.css">
    <link rel="stylesheet" href="../assets/css/vendors/bootstrap.css">
    <link rel="stylesheet" href="../assets/css/style.css">
    <link id="color" rel="stylesheet" href="../assets/css/color-1.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
</head>

<body>
    <!-- Login Page Start -->
    <div class="container-fluid p-0">
        <div class="row m-0">
            <div class="col-12 p-0">
                <div class="login-card login-dark">
                    <div>
                        <!-- Logo -->
                        <div class="text-center mb-4">
                            <img src="../assets/images/fuso_logo.png" height="40" alt="FUSO">
                            <h4 class="mt-3 mb-1">FUSO</h4>
                        </div>

                        <!-- Login Form -->
                        <div class="login-main">
                            <form class="theme-form" id="loginForm">

                                <div class="form-group">
                                    <label class="col-form-label">Email Address</label>
                                    <input class="form-control" id="email" type="email"
                                        required placeholder="Enter your email">
                                </div>

                                <div class="form-group">
                                    <label class="col-form-label">Password</label>
                                    <div class="form-input position-relative">
                                        <input class="form-control" id="password" type="password"
                                            required placeholder="********">
                                    </div>
                                </div>

                                <div class="form-group mb-0">
                                    <div class="checkbox p-0">
                                        <input id="remember" type="checkbox">
                                        <label class="text-muted" for="remember">Remember me</label>
                                    </div>

                                    <div class="text-end mt-3">
                                        <button class="btn btn-primary btn-block w-100" type="submit">
                                            Sign in
                                        </button>
                                    </div>
                                </div>

                                <!-- Error -->
                                <p id="loginError" class="text-danger text-center mt-3 d-none">
                                    Invalid email or password
                                </p>

                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- JS -->
    <script src="../assets/js/jquery.min.js"></script>
    <script src="../assets/js/bootstrap/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/icons/feather-icon/feather.min.js"></script>
    <script src="../assets/js/icons/feather-icon/feather-icon.js"></script>
    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/script.js"></script>

    <!-- LOGIN LOGIC -->
    <script>
        const API_BASE = "http://localhost:8090";

        document.getElementById("loginForm").addEventListener("submit", async function (e) {
            e.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            try {
                const res = await fetch(`${API_BASE}/login/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                if (!res.ok) {
                    document.getElementById("loginError").classList.remove("d-none");
                    return;
                }

                const data = await res.json();
                localStorage.setItem("access_token", data.access_token);

                // Redirect to main page after login
                window.location.href = "../template/index.html";

            } catch (err) {
                console.error(err);
                document.getElementById("loginError").classList.remove("d-none");
            }
        });
    </script>
</body>
</html>
